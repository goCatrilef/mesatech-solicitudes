spring.application.name=mesatech-solicitudes
server.port=${SERVER_PORT:8082}

# Spring Boot no carga ".env" solo: esta linea lo importa si existe (en EC2 tambien puedes exportar variables de entorno)
spring.config.import=optional:file:./.env[.properties]

# RDS exclusivo de Solicitudes (credenciales externalizadas)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA: crea/actualiza tablas. Alternativa documentada: sql/schema-solicitudes.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# RabbitMQ (EC2 C)
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Consumir un mensaje a la vez; ack AUTOMATICO de Spring: confirma solo si el listener termina sin excepcion
# (es decir, despues de guardar en RDS). Si falla, el mensaje se reencola.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=true

# Cola creada con infra/rabbitmq/setup-rabbitmq.sh
app.rabbitmq.queue=${RABBITMQ_QUEUE:solicitudes.catalogo.queue}
